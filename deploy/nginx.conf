server {
    listen 80;
    server_name wiki.example.com;
    root /var/www/kiowiki;
    index index.php;

    location ~ (^|/)\. {
        return 404;
    }
    location ~ ^/(app|deploy)(/|$) {
        return 404;
    }
    location ~ ^/assets/[A-Za-z0-9_-]+\.(css|js)$ {
        try_files $uri =404;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~* \.(php|sqlite|json|key|lock)(/|$) {
        return 404;
    }
    location / {
        rewrite ^ /index.php last;
    }
}
